services:
  community-manager-bot:
    build: .
    container_name: community-manager-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
    volumes:
      # SQLite database lives here so state survives restarts/updates.
      - ./data:/app/data
      - /home/housedv/projects/fleet-wiki/wiki:/app/fleet-wiki:ro
    extra_hosts:
      # Lets the container reach Ollama on the host (Mac Studio / iMac).
      - "host.docker.internal:host-gateway"
